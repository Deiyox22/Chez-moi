# Deploiement automatique sur Vercel.
#
# Deux secrets a creer dans Settings > Secrets and variables > Actions :
#   VERCEL_TOKEN     https://vercel.com/account/tokens
#   GEMINI_API_KEY   https://aistudio.google.com/apikey
# (ANTHROPIC_API_KEY est accepte a la place de GEMINI_API_KEY.)
#
# Les secrets restent dans GitHub : ils sont transmis a Vercel par ce workflow
# et n'apparaissent jamais dans les journaux.
name: Deployer sur Vercel

on:
  push:
    branches:
      - main
      - claude/pwa-interior-design-app-kr5euz
  workflow_dispatch:
    inputs:
      environnement:
        description: Environnement cible
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Verifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Analyse syntaxique
        run: npm run check
      - name: Validation des fichiers de configuration
        run: |
          node -e "['config/stores.json','vercel.json','public/manifest.webmanifest','server/catalog/data/seed-catalog.json'].forEach(f=>{JSON.parse(require('fs').readFileSync(f,'utf8'));console.log('ok',f)})"

  deployer:
    name: Deploiement
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environnement || 'production' }}
      url: ${{ steps.deploiement.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sans jeton, le deploiement est saute plutot qu'echoue : la CI reste verte
      # tant que le depot n'est pas relie a un compte Vercel.
      - name: Verifier la presence du jeton Vercel
        id: jeton
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploiement saute : le secret VERCEL_TOKEN est absent."
            {
              echo "## Deploiement saute"
              echo ""
              echo "Le secret \`VERCEL_TOKEN\` n'est pas defini."
              echo ""
              echo "1. Creez un jeton sur https://vercel.com/account/tokens"
              echo "2. Ajoutez-le dans Settings > Secrets and variables > Actions sous le nom \`VERCEL_TOKEN\`"
              echo "3. Ajoutez aussi \`GEMINI_API_KEY\`"
              echo "4. Relancez ce workflow depuis l'onglet Actions"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer la CLI Vercel
        if: steps.jeton.outputs.pret == 'true'
        run: npm i -g vercel@latest

      - name: Lier le projet Vercel
        if: steps.jeton.outputs.pret == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          # Au premier passage le projet n'existe pas encore : on le cree, puis on relie.
          if ! vercel link --yes --project chez-moi --token "$VERCEL_TOKEN"; then
            echo "Projet introuvable, creation."
            vercel project add chez-moi --token "$VERCEL_TOKEN"
            vercel link --yes --project chez-moi --token "$VERCEL_TOKEN"
          fi

      - name: Publier les variables d'environnement
        if: steps.jeton.outputs.pret == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          cible="${{ inputs.environnement || 'production' }}"

          pousser_variable() {
            nom="$1"; valeur="$2"
            if [ -z "$valeur" ]; then
              echo "$nom non fourni, ignore."
              return 0
            fi
            vercel env rm "$nom" "$cible" --yes --token "$VERCEL_TOKEN" > /dev/null 2>&1 || true
            printf '%s' "$valeur" | vercel env add "$nom" "$cible" --token "$VERCEL_TOKEN" > /dev/null
            echo "$nom publie sur $cible."
          }

          if [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Aucune cle d'IA (GEMINI_API_KEY ou ANTHROPIC_API_KEY). Le site sera deploye, mais l'analyse des photos et la generation d'amenagements resteront desactivees."
          fi
          pousser_variable GEMINI_API_KEY "$GEMINI_API_KEY"
          pousser_variable ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"

      - name: Deployer
        id: deploiement
        if: steps.jeton.outputs.pret == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.environnement || 'production' }}" = "production" ]; then
            url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          else
            url=$(vercel deploy --yes --token "$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Chez Moi est en ligne"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
