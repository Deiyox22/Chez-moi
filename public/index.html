<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chez Moi — design d'intérieur à partir de vos meubles</title>
    <meta name="description" content="Photographiez vos meubles, envoyez les photos de vos pièces, et recevez des propositions d'aménagement qui réutilisent ce que vous possédez." />
    <meta name="theme-color" content="#b5613f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chez Moi" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <a class="brand" href="#/" aria-label="Accueil Chez Moi">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__text">Chez&nbsp;Moi</span>
        </a>
        <button id="install-button" class="button button--ghost" hidden>Installer l'app</button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Navigation principale">
      <a href="#/" data-tab="/"><span class="tabbar__icon" aria-hidden="true">◆</span>Accueil</a>
      <a href="#/meubles" data-tab="/meubles"><span class="tabbar__icon" aria-hidden="true">▣</span>Meubles</a>
      <a href="#/pieces" data-tab="/pieces"><span class="tabbar__icon" aria-hidden="true">▤</span>Pièces</a>
      <a href="#/designs" data-tab="/designs"><span class="tabbar__icon" aria-hidden="true">✦</span>Designs</a>
      <a href="#/magasins" data-tab="/magasins"><span class="tabbar__icon" aria-hidden="true">⌂</span>Catalogue</a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="modal-root"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
